# main 푸시 = 배포. develop 푸시·PR은 테스트만 돈다.
# 배포에는 저장소 시크릿 CLOUDFLARE_API_TOKEN이 필요하다
# (Cloudflare 대시보드 → My Profile → API Tokens → "Edit Cloudflare Workers" 템플릿 + Account > D1 > Edit 권한).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: D1 마이그레이션 적용 (멱등)
        run: npx wrangler d1 migrations apply geulgae-bot-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Workers 배포
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
