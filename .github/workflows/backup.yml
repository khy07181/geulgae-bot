# 벌금 원장이 사는 D1을 매주 SQL 덤프로 떠서 backups 브랜치에 쌓는다.
# 파일은 backup.sql 하나를 덮어쓰고, 주별 스냅숏은 git 커밋 히스토리로 남는다.
# D1 자체의 Time Travel(30일)을 넘어서는 영구 보관용.
name: D1 backup

on:
  schedule:
    - cron: "30 15 * * 0" # 월요일 00:30 KST — 일요일 마감·정산(00:01) 직후 스냅숏
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: D1 전체 덤프
        run: npx wrangler d1 export geulgae-bot-db --remote --output=/tmp/backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: backups 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backups >/dev/null; then
            git fetch origin backups
            git switch -c backups FETCH_HEAD
          else
            git switch --orphan backups
          fi
          cp /tmp/backup.sql backup.sql
          git add backup.sql
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "backup: $(date -u +%FT%TZ)"
            git push origin backups
          fi
